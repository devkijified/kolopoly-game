name: keep-warm

# Disabled. Kolopoly's free host is Cloudflare Workers, which does not
# sleep. This workflow used to ping the old Render service every 10
# minutes. The schedule is gone so it cannot wake that service.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to warm
        run: echo "keep-warm is disabled. Cloudflare Workers do not sleep. See deploy/CLOUDFLARE.md."
