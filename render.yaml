# The Render web service that serves kolopoly.fun (Node host, server.js).
# deploy/CLOUDFLARE.md describes the Worker host; Play to Earn payments,
# payouts and the money desk live on this Node host. See
# docs/PLAY-TO-EARN.md for what each variable does.
services:
  - type: web
    name: kolopoly-game
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: KP_ADMIN_TOKEN
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: KP_AUTH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: KP_MAIL_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KP_PUBLIC_URL
        value: https://kolopoly.fun
      - key: KP_PAYOUT_MODE
        value: manual
